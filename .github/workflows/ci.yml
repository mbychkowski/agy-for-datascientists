name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          pattern='^(issue[0-9]{3}|chore)/[a-z0-9-]+$'
          if [[ ! "$HEAD_REF" =~ $pattern ]]; then
            echo "::error::Branch '$HEAD_REF' must be issue<3-digit-id>/<slug> or chore/<slug> (AGENTS.md § Worktree execution)."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            .agents/plugins/ds-command-center/sidecars/evidence-board/frontend/package-lock.json

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Install dependencies
        run: npm ci

      - name: Install Evidence Board backend dependencies
        run: uv pip install --system -r .agents/plugins/ds-command-center/sidecars/evidence-board/requirements.txt

      - name: Check GLOSSARY compliance
        run: node bin/check-glossary.js

      - name: Run Ruff (Lint)
        uses: astral-sh/ruff-action@v3
        with:
          args: 'check --output-format=github .'

      - name: Check Ruff formatting
        uses: astral-sh/ruff-action@v3
        with:
          args: 'format --check .'

      - name: Run shell syntax check & test suite
        run: make test

      - name: Build Evidence Board frontend (type check + Vite build)
        run: make build-frontend

      - name: Run shellcheck
        run: make lint-sh

      - name: Run Terraform init, validate & fmt check
        run: make lint-tf
